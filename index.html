<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي الـ PWA</title>
    <link rel="stylesheet" href="style.css">
    <!-- ربط ملف الـ Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- لون شريط المتصفح للأجهزة المحمولة -->
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في تطبيق الـ PWA الخاص بك!</h1>
        <p>هذا التطبيق يعمل كصفحة ويب ويمكن تثبيته على هاتفك أو حاسوبك.</p>
        <button id="installBtn" style="display: none;">تثبيت التطبيق</button>
    </div>

    <script>
        // تسجيل الـ Service Worker لتمكين العمل دون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // زر التثبيت
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';

            installBtn.addEventListener('click', () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            });
        });
    </script>
</body>
</html>
